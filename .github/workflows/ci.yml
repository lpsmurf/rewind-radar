name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: bash scripts/sync-edge.sh
      - run: deno check supabase/functions/api/index.ts
